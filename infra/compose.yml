# Pile locale et de recette. La production utilise le même fichier avec un
# .env différent et des images construites en intégration continue.
#
#   docker compose -f infra/compose.yml --env-file .env up --build
#
# Le socle de données arrive au lot 2 ; postgres est déjà là pour que
# l'environnement local n'ait pas à changer de forme à ce moment-là.

name: 5sursync

services:
  nginx:
    image: nginx:1.27-alpine
    depends_on: [web, api]
    ports:
      - "8080:80"
    volumes:
      - ./nginx/5sursync.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
      args:
        ENABLE_DESIGN_WORKSHOP: ${ENABLE_DESIGN_WORKSHOP:-0}
    environment:
      NODE_ENV: production
      PORT: 3000
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:4000}
    expose: ["3000"]
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      # LES DEUX CONNEXIONS, ET NON UNE SEULE.
      #
      # DATABASE_URL appartient au propriétaire des tables, qui contourne
      # Row-Level Security ; DATABASE_APP_URL est le rôle app_5sync, à qui les
      # politiques d'isolation s'appliquent, et c'est le seul que l'API emploie.
      #
      # Elles manquaient ici. assertProductionConfig() exige la seconde dès que
      # NODE_ENV=production — donc toujours, dans ce fichier : l'API refusait de
      # démarrer, et la pile ne pouvait pas monter. Le refus était le bon
      # comportement ; c'est la configuration qui était incomplète.
      DATABASE_APP_URL: ${DATABASE_APP_URL}
      DATABASE_APP_PASSWORD: ${DATABASE_APP_PASSWORD:-}
      DOCUMENTS_DIR: /srv/documents
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_DESACTIVE: ${MAIL_DESACTIVE:-0}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      SAUVEGARDE_DIR: /srv/sauvegardes
    volumes:
      # Les documents survivent au conteneur : les perdre serait perdre des
      # livrables validés contradictoirement.
      - documents:/srv/documents
      # Les sauvegardes, EN LECTURE SEULE.
      #
      # L'API n'y écrit jamais — ce sont les scripts d'infrastructure qui
      # sauvegardent. Elle a seulement besoin de lire les manifestes et les
      # marqueurs pour dire, dans /api/v1/metrics, quand date la dernière
      # sauvegarde et le dernier exercice de restauration réussi.
      #
      # « :ro » n'est pas une précaution de principe : un service exposé au
      # réseau qui peut écrire dans le répertoire de sauvegarde annule une
      # bonne part de l'intérêt d'avoir des sauvegardes.
      - ${SAUVEGARDE_DIR:-../.sauvegardes}:/srv/sauvegardes:ro
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["4000"]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # L'API attend que la base réponde, pas seulement que le conteneur tourne.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  documents:
