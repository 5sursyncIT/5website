# Un seul domaine, deux services. C'est ce qui supprime CORS et garde les
# cookies de session en first-party.
#
# TLS et HSTS sont posés par le terminateur en amont sur le VPS (certbot) ;
# ce fichier décrit le routage et les en-têtes applicatifs.

upstream web { server web:3000; }
upstream api { server api:4000; }

server {
  listen 80;
  server_name _;

  # ── En-têtes de sécurité ───────────────────────────────────────────────
  # La CSP est volontairement stricte : les CSS Modules et les composants
  # serveur rendent 'unsafe-inline' inutile. Elle sera resserrée encore au
  # lot 5, avec un nonce sur les scripts de Next.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

  client_max_body_size 25m;

  # ── API ────────────────────────────────────────────────────────────────
  location /api/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # On écrase l'en-tête plutôt que de le relayer : un client ne doit pas
    # pouvoir choisir son propre identifiant de requête.
    proxy_set_header X-Request-Id $request_id;
  }

  # ── Fichiers générés par Next, immuables et empreintés ─────────────────
  location /_next/static/ {
    proxy_pass http://web;
    proxy_cache_valid 200 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # ── Le reste : le site ─────────────────────────────────────────────────
  location / {
    proxy_pass http://web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
