# Un seul domaine, deux services. C'est ce qui supprime CORS et garde les
# cookies de session en first-party.
#
# TLS et HSTS sont posés par le terminateur en amont sur le VPS (certbot) ;
# ce fichier décrit le routage et les en-têtes applicatifs.

upstream web { server web:3000; }
upstream api { server api:4000; }

server {
  listen 80;
  server_name _;

  # ── En-têtes de sécurité ───────────────────────────────────────────────
  #
  # LA CSP N'EST PAS POSÉE ICI. Elle est émise par le middleware de Next, qui
  # seul peut produire un nonce par requête pour les routes authentifiées.
  # La dupliquer ici la rendrait plus faible : quand deux en-têtes CSP
  # coexistent, le navigateur applique l'INTERSECTION, et le moindre écart
  # entre les deux casse la page sans que la cause soit visible.
  #
  # HSTS reste ici : c'est une décision d'infrastructure, pas d'application, et
  # elle doit valoir même si le service applicatif ne répond pas.
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

  # Doit rester aligné sur DOCUMENTS_TAILLE_MAX de l'API : plus bas, Nginx
  # coupe avant que l'API ne puisse expliquer pourquoi ; plus haut, l'API
  # reçoit et jette un corps qu'il aurait fallu refuser plus tôt.
  client_max_body_size 25m;

  # Limitation de débit sur l'authentification, en complément de celle tenue en
  # base par l'API : celle-ci arrête le trafic avant qu'il n'atteigne Node,
  # celle-là compte par adresse ET par compte. Aucune des deux ne remplace
  # l'autre.
  limit_req_zone $binary_remote_addr zone=connexion:10m rate=10r/m;

  # ── API ────────────────────────────────────────────────────────────────
  location /api/v1/auth/ {
    limit_req zone=connexion burst=5 nodelay;
    limit_req_status 429;

    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }

  location /api/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # On écrase l'en-tête plutôt que de le relayer : un client ne doit pas
    # pouvoir choisir son propre identifiant de requête.
    proxy_set_header X-Request-Id $request_id;
  }

  # ── Fichiers générés par Next, immuables et empreintés ─────────────────
  location /_next/static/ {
    proxy_pass http://web;
    proxy_cache_valid 200 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # ── Le reste : le site ─────────────────────────────────────────────────
  location / {
    proxy_pass http://web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
